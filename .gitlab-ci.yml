stages:
  - check
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"

cache:
  paths:
    - .pip-cache/

lint:
  stage: check
  image: python:3.12-slim
  script:
    - pip install ruff
    - ruff check src/ tests/
    - ruff format --check src/ tests/

test:
  stage: test
  image: python:3.12-slim
  script:
    - pip install -e ".[dev]"
    - pytest tests/ -k "not integration" -v --tb=short
