stages:
  - check
  - test
  - build
  - release

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  # Container registry path on DLE GitLab
  CONTAINER_IMAGE: "$CI_REGISTRY_IMAGE"

cache:
  paths:
    - .pip-cache/

# --- Stage: check (every push) ---

lint:
  stage: check
  image: python:3.12-slim
  script:
    - pip install ruff
    - ruff check src/ tests/
    - ruff format --check src/ tests/

# --- Stage: test (every push) ---

test:
  stage: test
  image: python:3.12-slim
  script:
    - pip install -e ".[dev]"
    - pytest tests/ -k "not integration" -v --tb=short

# --- Stage: build (main branch only) ---
# Uses Kaniko instead of Docker-in-Docker — DLE shared runners don't support DinD.

build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"username\":\"${CI_REGISTRY_USER}\",\"password\":\"${CI_REGISTRY_PASSWORD}\"}}}" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${CONTAINER_IMAGE}:latest"
      --destination "${CONTAINER_IMAGE}:${CI_COMMIT_SHORT_SHA}"
      --cache=true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# --- Stage: build (tagged releases) ---

build-release:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"username\":\"${CI_REGISTRY_USER}\",\"password\":\"${CI_REGISTRY_PASSWORD}\"}}}" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${CONTAINER_IMAGE}:${CI_COMMIT_TAG}"
      --destination "${CONTAINER_IMAGE}:latest"
      --cache=true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

# Build Apptainer/Singularity image from Docker image for HPC deployment.
# Converts the Docker image we already built — no separate definition file needed.
# Output: chat-to-cop_<tag>.sif uploaded as a job artifact.
build-apptainer:
  stage: build
  image: quay.io/singularity/singularity:v4.1.0
  variables:
    SINGULARITY_CACHEDIR: "$CI_PROJECT_DIR/.singularity-cache"
    SINGULARITY_DOCKER_USERNAME: "$CI_REGISTRY_USER"
    SINGULARITY_DOCKER_PASSWORD: "$CI_REGISTRY_PASSWORD"
  script:
    - singularity build chat-to-cop_${CI_COMMIT_TAG:-latest}.sif docker://$CONTAINER_IMAGE:${CI_COMMIT_TAG:-latest}
  artifacts:
    paths:
      - "*.sif"
    expire_in: 90 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  needs:
    - build-release

# Build HPC image with CUDA + Ollama + baked models (Qwen2.5-14B + 7B).
# This is the full offline-capable container for DSRC Narwhal (V100 32GB).
# Model download happens during build — no GPU needed.
build-hpc:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"username\":\"${CI_REGISTRY_USER}\",\"password\":\"${CI_REGISTRY_PASSWORD}\"}}}" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/deploy/dsrc/Dockerfile.hpc"
      --destination "${CONTAINER_IMAGE}:hpc-${CI_COMMIT_TAG:-latest}"
      --destination "${CONTAINER_IMAGE}:hpc-latest"
      --cache=true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  timeout: 2h

# Convert HPC Docker image to Apptainer .sif for DSRC deployment.
# Download the .sif from the release artifacts and scp to Narwhal.
build-hpc-sif:
  stage: build
  image: quay.io/singularity/singularity:v4.1.0
  variables:
    SINGULARITY_CACHEDIR: "$CI_PROJECT_DIR/.singularity-cache"
    SINGULARITY_DOCKER_USERNAME: "$CI_REGISTRY_USER"
    SINGULARITY_DOCKER_PASSWORD: "$CI_REGISTRY_PASSWORD"
  script:
    - singularity build chat-to-cop-hpc_${CI_COMMIT_TAG:-latest}.sif docker://$CONTAINER_IMAGE:hpc-${CI_COMMIT_TAG:-latest}
  artifacts:
    paths:
      - "chat-to-cop-hpc_*.sif"
    expire_in: 90 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  needs:
    - build-hpc
  timeout: 1h

# --- Stage: release (tagged releases) ---

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Creating release for $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Release $CI_COMMIT_TAG"
    description: |
      ## Container Images

      **Docker:**
      ```
      docker pull $CONTAINER_IMAGE:$CI_COMMIT_TAG
      ```

      **Apptainer/Singularity (for DSRC HPC):**
      Download `chat-to-cop_$CI_COMMIT_TAG.sif` from the build artifacts.
      ```
      singularity run chat-to-cop_$CI_COMMIT_TAG.sif
      ```

      See the [CHANGELOG](CHANGELOG.md) for details.
    assets:
      links:
        - name: "Apptainer SIF image (slim, no LLM)"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/chat-to-cop_${CI_COMMIT_TAG}.sif?job=build-apptainer"
        - name: "Apptainer SIF image (HPC, with Ollama + Qwen2.5-14B)"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/chat-to-cop-hpc_${CI_COMMIT_TAG}.sif?job=build-hpc-sif"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  needs:
    - build-apptainer
    - build-hpc-sif
