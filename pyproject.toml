[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chat-to-cop"
version = "0.1.0"
description = "AI staff officers for real-time world-state extraction from military chat to Common Operating Picture"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "instructor>=1.0",
    "openai>=1.0",
    "websockets>=12.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "loguru>=0.7",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chat_to_cop"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests requiring external services (Ollama, IRC server, etc.)",
]
