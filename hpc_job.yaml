    venues: [narwhal, blueback]
    shared_with: []
    restage_from: "not documented in any script read for this card -- $WORK/chat/Dash3-GBC/Data/23Sep/usaf/chat.zip is referenced as already-present; no pull/stage script found"
    purge_risk: "Narwhal 14-30 day Lustre purge (VENUES.yaml) if under $WORKDIR"
    last_verified: null
  - name: "Ollama models (model-b:3b/7b/14b/32b-family tags, model-b:30b-a3b)"
    gb: null   # sizes not sourced from any doc/script read for this card
    venues: [narwhal, blueback]
    shared_with: []
    restage_from: "ollama pull (registry.ollama.ai) -> $WORK/ollama-models; submit_speaker_sweep.py --pull-models automates this for the sweep"
    purge_risk: "Narwhal 14-30 day Lustre / Blueback ~30-day scratch (VENUES.yaml)"
    last_verified: null
  - name: "replay_14b_without_speakers_5973223.db (committed in-repo)"
