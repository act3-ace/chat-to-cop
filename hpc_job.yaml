    # sw-<name> -> c2c-sw-<name> (one f-string in submit_speaker_sweep.py's
    # submit_cell()). Not made here -- out of scope for this card.
  check_cmd: >-
    NOT YET WRITTEN -- no health-check script exists in scripts/ for this job
    today. Proposed path: scripts/c2c_eval_health.sh. Proposed C2 contract,
    given job.status=parked: 0 OK = `squeue -u hsclouse --name=c2c-*` (and,
    once renamed, c2c-replay-bench / c2c-sw-*) returns nothing AND no
    resubmission is currently expected (parked, by design); 10 RUNNING = a
    matching job is R/PD; 30 FAILED = sacct State is
    FAILED/TIMEOUT/OUT_OF_ME/NODE_FAIL for the most recent submission, OR
    State=COMPLETED but the expected output .db is missing OR implausibly
    small (< a few KB -- the exact failure mode already found once, see
    sizing.observed_per_unit's 0-byte artifact); 40 UNKNOWN = no squeue/sacct
    on PATH, no ticket, or nothing has ever matched the glob.
  end_to_end_cmd: null   # n/a -- batch-campaign, not a service
  cancelled_is_failed: true   # no self-resubmit chain (schedule.chaining: none); a cancelled/preempted eval run should surface as needing a rerun, not be silently ignored -- especially given the 0-byte artifact already found once in this repo

