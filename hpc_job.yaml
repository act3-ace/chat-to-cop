data:
  classification: >-
    "DASH event data is IL2 through the MASH event. Becomes CUI after."
    (README.md, verbatim). MASH was May 2026 -- per that statement, DASH-3
    chat corpora and any eval artifacts derived from them (SQLite DBs, sweep
    results) are CUI as of this card's 2026-08-07 pass. pii: not explicitly
    assessed in any doc read; chat content includes real callsigns/operator
    handles per the project's own description (speaker modeling, per-user
    online learning).
  ingress:
    desc: "DASH-3 chat.zip corpus (pre-staged, source/staging mechanism not found in scripts read); one-time Ollama model pulls per model tag"
    gb_day: null
  egress:
    dest: "$ARCHIVE_HOME/chat-to-cop/ on Narwhal (inconsistently automated -- see venues[narwhal].pins); results/ on Blueback (blueback_replay_bench.sh)"
    method: "cp (trap-based/automatic for narwhal_14b_run_a.sh + run_b.sh; manual/echo-only suggestion for narwhal_14b_ab.sh)"
  at_rest: "$WORK/output (Narwhal, purge-eligible 14-30 day Lustre) / results/ (Blueback, purge-eligible ~30-day scratch)"
  durable_archive: >-
    $ARCHIVE_HOME/chat-to-cop/ when the archive step actually runs (see
    venues[narwhal].pins for the inconsistency across scripts). At least one
    recovered artifact (replay_14b_without_speakers_5973223.db) is committed
    directly into the git repo root rather than living under the documented
    $ARCHIVE_HOME pattern -- and it is 0 bytes (see assets), so this
    particular "durable copy" preserves no actual data.
  retention: >-
    No formal retention policy found. The README's CUI-after-MASH
    classification note (above) implies retention/handling obligations that
    are not reflected in any script-level access control read for this
    card -- flagging as a documentation gap, not asserting a violation
    (per workspace standing rule, no filtering applied here -- surfaced as
    found).

auth:
  human_gated:
    - step: >-
        kinit via HPCMP KfW (Windows) + YubiKey OTP for SSH to Narwhal/Blueback
        (paramiko GSSAPI wrapper, scripts/narwhal_connect.py -- bridges MIT
        Kerberos for Windows because Git Bash's native OpenSSH cannot read the
        API: credential cache and PuTTY 0.76 hangs on kex with OpenSSH 10.2,
        per the script's own header docstring)
      cadence: "~10h ticket lifetime"
      mitigation: "hpc-ticket-keeper skill, or iLauncher kinit"
  secrets: [hpcmp_password, yubikey_otp_pool]

schedule:
  cadence: "episodic -- validation/eval campaigns tied to specific issues (#26, #52, #73) and config decisions, not scheduled or standing. None in any queue now (job.status)."
  chaining: >-
    None -- each script is a discrete sbatch (or array) submission.
    submit_speaker_sweep.py generates independent array jobs per factorial
    cell with no scheduler dependency between them; eval_speaker_sweep.py
    aggregates results post-hoc, run manually after all arrays complete.
  heartbeat: null
  preemptible: null   # NOT ESTABLISHED -- qos=standard (Narwhal) / partition=debug (Blueback) used throughout; no explicit preemption policy for either found in any source read
  resume_cost:
    mechanism: >-
      Re-submit the relevant script. Run A / Run B are independent (either
      can be resubmitted alone without repeating the other); sweep cells are
      independent array tasks (submit_speaker_sweep.py can resubmit a subset
      via --models/--seed-only/--stoch-only). No checkpoint concept observed
      -- a killed run restarts the full replay from message 1.
    unit_of_resume: "one script submission (single run) or one array cell (sweep)"
    cost_per_unit: "model-size-dependent, 3-16h walltime x 1 V100 (submit_speaker_sweep.py's WALLTIMES table)"
    cost_worst_case: "~16h x 1 V100 = 16 GPU-hours (~2,048 core-hours at Narwhal's 128-cores/node whole-node billing) for a single killed 32B sweep cell restarted from scratch"

